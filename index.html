<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代購集運管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ExcelJS CDN (用於報表導出) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- 頂部導航 -->
  <header class="bg-slate-900 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-bold text-amber-400">⚙️ 代購集運 - 後台管理系統</h1>
      <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">Firestore 實時連線中</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    
    <!-- 頂部控制區與計算機小工具 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 匯出與設定區塊 -->
      <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between gap-4">
        <div class="flex items-center gap-3">
          <label class="font-medium text-sm">預設結算匯率 (JPY ➔ TWD):</label>
          <input type="number" id="global-rate" value="0.22" step="0.001" oninput="calculateCalcWidget()" class="w-28 px-3 py-1 border rounded-md text-center font-mono focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <!-- 時間區間報表導出 -->
        <div class="flex flex-wrap items-center gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200">
          <span class="text-xs font-bold text-slate-600">📊 匯出區間：</span>
          <input type="date" id="export-start-date" class="px-2 py-1 border rounded text-xs">
          <span class="text-xs text-slate-400">至</span>
          <input type="date" id="export-end-date" class="px-2 py-1 border rounded text-xs">
          <button onclick="exportMonthlyReport()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition shadow-sm">
            導出 XLSX 報表
          </button>
        </div>
      </div>

      <!-- 🧮 需求 3: 計算機小工具 -->
      <div class="bg-amber-50/60 p-5 rounded-xl shadow-sm border border-amber-200/80 flex flex-col justify-between">
        <div class="flex justify-between items-center mb-2">
          <h4 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
            <span>🧮</span> 日幣試算計算機
          </h4>
          <span class="text-[10px] text-amber-700 font-mono bg-amber-100 px-2 py-0.5 rounded">即時換算</span>
        </div>
        <div class="space-y-3">
          <div>
            <label class="block text-[11px] text-slate-500 mb-1">輸入日幣金額 (JPY)</label>
            <input type="number" id="calc-jpy" oninput="calculateCalcWidget()" placeholder="例如: 10000" class="w-full px-3 py-1.5 border border-amber-300 rounded-md text-sm font-mono focus:ring-2 focus:ring-amber-500 outline-none bg-white">
          </div>
          <div class="bg-white p-2.5 rounded-lg border border-amber-200/60 flex justify-between items-center">
            <span class="text-xs text-slate-500">預估台幣 (TWD)</span>
            <span class="text-lg font-bold font-mono text-amber-600" id="calc-twd-result">NT$ 0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 需求 1: 新增代購委託資料 (支援多商品連續新增) -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h3 class="text-lg font-bold mb-4 text-slate-800 border-b pb-2">新增代購委託資料</h3>
      <form id="order-form" onsubmit="handleSaveOrder(event)" class="space-y-4">
        
        <!-- 客戶與訂單基本資料 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-lg border border-slate-100">
          <div>
            <label class="block text-xs text-slate-500 mb-1">成交日期</label>
            <input type="date" id="input-date" required class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">客人姓名</label>
            <input type="text" id="input-name" required oninput="onNameInput()" placeholder="如：Rosemary" class="w-full px-3 py-2 border rounded-md text-sm focus:ring-2 focus:ring-amber-500 outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">客戶編號</label>
            <input type="text" id="input-code" required oninput="onCodeInput()" placeholder="如：PS839ab12" class="w-full px-3 py-2 border rounded-md text-sm font-mono text-amber-700 font-bold focus:ring-2 focus:ring-amber-500 outline-none bg-white">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">商家/官網訂單編號</label>
            <input type="text" id="input-po" placeholder="如：駿河屋-0892 / AmazonJP-123" class="w-full px-3 py-2 border rounded-md text-sm font-mono focus:ring-2 focus:ring-amber-500 outline-none bg-white">
          </div>
        </div>

        <!-- 動態商品列表 -->
        <div class="space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-600">📦 委託商品明細 (可連續新增多個)</span>
            <button type="button" onclick="addItemRow()" class="text-xs text-amber-600 hover:text-amber-700 font-bold flex items-center gap-1 bg-amber-50 px-3 py-1 rounded border border-amber-200">
              ➕ 增加一筆商品
            </button>
          </div>

          <div id="items-container" class="space-y-2">
            <!-- 初始預設一行商品列 -->
          </div>
        </div>

        <!-- 初始貨態與送出 -->
        <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t">
          <div class="w-full md:w-64">
            <label class="block text-xs text-slate-500 mb-1">初始貨態</label>
            <select id="input-status" class="w-full px-3 py-2 border rounded-md text-sm bg-white border-slate-300 focus:ring-2 focus:ring-amber-500 outline-none">
              <option value="🟡 採購中">🟡 採購中</option>
              <option value="🔵 日本倉庫已收貨">🔵 日本倉庫已收貨</option>
              <option value="🟣 國際運送中">🟣 國際運送中</option>
              <option value="🟠 抵達台灣倉庫">🟠 抵達台灣倉庫</option>
              <option value="🟢 已寄出">🟢 已寄出</option>
              <option value="✅ 已結單">✅ 已結單</option>
            </select>
          </div>

          <button type="submit" id="btn-submit" class="bg-slate-900 hover:bg-slate-800 text-white font-medium px-8 py-2.5 rounded-lg text-sm transition shadow-sm self-end">
            確認寫入 Firestore 雲端
          </button>
        </div>
      </form>
    </div>

    <!-- 訂單清單 (分頁與批量修改) -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      
      <!-- 頁籤與搜尋過濾器 -->
      <div class="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
        <div class="flex gap-2">
          <button onclick="switchView('active')" id="tab-active" class="px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-white shadow-sm transition">
            ⏳ 交易中訂單 (<span id="count-active">0</span>)
          </button>
          <button onclick="switchView('completed')" id="tab-completed" class="px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
            ✅ 已結單歷史 (<span id="count-completed">0</span>)
          </button>
        </div>

        <!-- 清單搜尋/篩選工具區 -->
        <div class="flex flex-wrap items-center gap-2">
          <input type="text" id="filter-keyword" oninput="renderAdminTable()" placeholder="🔍 搜姓名 / 客戶編號 / 商家單號 / 商品..." class="px-3 py-1.5 border rounded-lg text-xs w-64 focus:ring-2 focus:ring-amber-500 outline-none">
          <select id="filter-status" onchange="renderAdminTable()" class="px-3 py-1.5 border rounded-lg text-xs bg-white focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="">全部貨態篩選</option>
            <option value="🟡 採購中">🟡 採購中</option>
            <option value="🔵 日本倉庫已收貨">🔵 日本倉庫已收貨</option>
            <option value="🟣 國際運送中">🟣 國際運送中</option>
            <option value="🟠 抵達台灣倉庫">🟠 抵達台灣倉庫</option>
            <option value="🟢 已寄出">🟢 已寄出</option>
            <option value="✅ 已結單">✅ 已結單</option>
          </select>
          <button onclick="clearFilters()" class="text-xs text-slate-400 hover:text-slate-600 underline">重置篩選</button>
        </div>
      </div>

      <!-- ⚡ 批量操作工具列 -->
      <div id="batch-bar" class="bg-amber-50 border border-amber-200 p-3 rounded-lg flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex items-center gap-2">
          <span class="font-bold text-amber-900">⚡ 批量更新貨態：</span>
          <span>已勾選/顯示 <strong id="selected-count" class="text-amber-700">0</strong> 筆資料</span>
        </div>
        <div class="flex items-center gap-2">
          <select id="batch-target-status" class="px-3 py-1.5 border rounded-lg text-xs bg-white font-medium focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="🟡 採購中">🟡 採購中</option>
            <option value="🔵 日本倉庫已收貨">🔵 日本倉庫已收貨</option>
            <option value="🟣 國際運送中">🟣 國際運送中</option>
            <option value="🟠 抵達台灣倉庫">🟠 抵達台灣倉庫</option>
            <option value="🟢 已寄出">🟢 已寄出</option>
            <option value="✅ 已結單">✅ 已結單</option>
          </select>
          <button onclick="executeBatchUpdate()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-1.5 rounded-lg font-bold transition shadow-sm">
            一鍵更新勾選筆數
          </button>
        </div>
      </div>

      <!-- 表格清單 -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 text-xs border-b">
              <th class="p-3 w-8">
                <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)" class="rounded text-amber-500 focus:ring-amber-500">
              </th>
              <th class="p-3">日期</th>
              <th class="p-3">客戶編號</th>
              <th class="p-3">客戶姓名</th>
              <th class="p-3">商家/官網單號</th>
              <th class="p-3">商品名稱</th>
              <th class="p-3">日幣金額</th>
              <th class="p-3">台幣金額</th>
              <th class="p-3">預估利潤</th>
              <th class="p-3">貨態 (可直接修改)</th>
              <th class="p-3">操作</th>
            </tr>
          </thead>
          <tbody id="admin-order-list" class="divide-y text-sm">
            <tr><td colspan="11" class="p-4 text-center text-slate-400">連線至 Firestore 資料庫中...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ✏️ 需求 2: 訂單修改 Modal 視窗 -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-base font-bold text-slate-800">✏️ 修改訂單內容</h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>

      <form id="edit-form" onsubmit="handleUpdateOrder(event)" class="space-y-3 text-xs">
        <input type="hidden" id="edit-doc-id">
        
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 mb-1">成交日期</label>
            <input type="date" id="edit-date" required class="w-full px-2.5 py-1.5 border rounded focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-500 mb-1">客戶編號</label>
            <input type="text" id="edit-code" required class="w-full px-2.5 py-1.5 border rounded font-mono font-bold text-amber-700 focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 mb-1">客人姓名</label>
            <input type="text" id="edit-name" required class="w-full px-2.5 py-1.5 border rounded focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-500 mb-1">商家/官網單號</label>
            <input type="text" id="edit-po" class="w-full px-2.5 py-1.5 border rounded font-mono focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 mb-1">商品名稱</label>
          <input type="text" id="edit-item" required class="w-full px-2.5 py-1.5 border rounded focus:ring-2 focus:ring-amber-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-500 mb-1">日幣金額 (JPY)</label>
            <input type="number" id="edit-jpy" required class="w-full px-2.5 py-1.5 border rounded font-mono focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
          <div>
            <label class="block text-slate-500 mb-1">台幣金額 (TWD)</label>
            <input type="number" id="edit-twd" required class="w-full px-2.5 py-1.5 border rounded font-mono focus:ring-2 focus:ring-amber-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 mb-1">貨態</label>
          <select id="edit-status" class="w-full px-2.5 py-1.5 border rounded bg-white focus:ring-2 focus:ring-amber-500 outline-none">
            <option value="🟡 採購中">🟡 採購中</option>
            <option value="🔵 日本倉庫已收貨">🔵 日本倉庫已收貨</option>
            <option value="🟣 國際運送中">🟣 國際運送中</option>
            <option value="🟠 抵達台灣倉庫">🟠 抵達台灣倉庫</option>
            <option value="🟢 已寄出">🟢 已寄出</option>
            <option value="✅ 已結單">✅ 已結單</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded bg-slate-100 hover:bg-slate-200 text-slate-600 transition">取消</button>
          <button type="submit" class="px-4 py-2 rounded bg-amber-500 hover:bg-amber-600 text-white font-bold transition">儲存修改</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 引入 Firebase SDK (Firestore 模組) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, addDoc, onSnapshot, deleteDoc, updateDoc, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBprY_kKxxx7pPC_7yeyoJw8yacMnpVwMs",
      authDomain: "pigshop.firebaseapp.com",
      projectId: "pigshop",
      storageBucket: "pigshop.firebasestorage.app",
      messagingSenderId: "77868439383",
      appId: "1:77868439383:web:f4ab73260824ea8fc99012",
      measurementId: "G-BLW4Z75XZV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let globalCustomersByName = {};
    let globalCustomersByCode = {};
    let globalOrders = [];
    let currentDisplayedOrders = [];
    let currentTab = 'active';

    const PREFIX = "PS";

    function generateCustomerCode() {
      const letters = "abcdefghijklmnopqrstuvwxyz";
      const num1 = Math.floor(100 + Math.random() * 900); 
      const char1 = letters.charAt(Math.floor(Math.random() * letters.length));
      const char2 = letters.charAt(Math.floor(Math.random() * letters.length));
      const num2 = Math.floor(10 + Math.random() * 90); 

      return `${PREFIX}${num1}${char1}${char2}${num2}`;
    }

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function initDates() {
      const today = getTodayString();
      document.getElementById('input-date').value = today;
      
      const now = new Date();
      const firstDayOfMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
      document.getElementById('export-start-date').value = firstDayOfMonth;
      document.getElementById('export-end-date').value = today;
    }

    initDates();

    // 🧮 試算計算機邏輯
    window.calculateCalcWidget = function() {
      const jpy = parseFloat(document.getElementById('calc-jpy').value) || 0;
      const rate = parseFloat(document.getElementById('global-rate').value) || 0.22;
      const twd = Math.round(jpy * rate);
      document.getElementById('calc-twd-result').innerText = `NT$ ${twd.toLocaleString()}`;
    };

    // 📦 多商品動態新增邏輯
    let itemCounter = 0;
    window.addItemRow = function(item = '', jpy = '', twd = '') {
      itemCounter++;
      const container = document.getElementById('items-container');
      const row = document.createElement('div');
      row.className = "item-row grid grid-cols-1 md:grid-cols-12 gap-2 items-center bg-slate-50 p-2.5 rounded border border-slate-200";
      row.id = `item-row-${itemCounter}`;

      row.innerHTML = `
        <div class="md:col-span-5">
          <input type="text" class="item-name w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none bg-white" placeholder="商品名稱 (如: ツイスタ ぬいぐるみ)" value="${item}" required>
        </div>
        <div class="md:col-span-3">
          <input type="number" class="item-jpy w-full px-3 py-1.5 border rounded text-xs font-mono focus:ring-2 focus:ring-amber-500 outline-none bg-white" placeholder="日幣 JPY" value="${jpy}" required>
        </div>
        <div class="md:col-span-3">
          <input type="number" class="item-twd w-full px-3 py-1.5 border rounded text-xs font-mono focus:ring-2 focus:ring-amber-500 outline-none bg-white" placeholder="台幣 TWD" value="${twd}" required>
        </div>
        <div class="md:col-span-1 text-right">
          <button type="button" onclick="removeItemRow('${itemCounter}')" class="text-xs text-rose-500 hover:text-rose-700 font-bold px-1 py-1">✕</button>
        </div>
      `;

      container.appendChild(row);
    };

    window.removeItemRow = function(id) {
      const rows = document.querySelectorAll('.item-row');
      if (rows.length <= 1) {
        alert('至少需保留一筆商品資料！');
        return;
      }
      const target = document.getElementById(`item-row-${id}`);
      if (target) target.remove();
    };

    // 初始化新增一列商品
    addItemRow();

    // 1. 實時監聽 Firestore 訂單 (buy_agent_orders)
    onSnapshot(collection(db, "buy_agent_orders"), (snapshot) => {
      globalOrders = [];
      snapshot.forEach((docSnap) => {
        globalOrders.push({ docId: docSnap.id, ...docSnap.data() });
      });
      renderAdminTable();
    });

    // 2. 實時監聽 Firestore 客戶名冊 (buy_agent_customers)
    onSnapshot(collection(db, "buy_agent_customers"), (snapshot) => {
      globalCustomersByName = {};
      globalCustomersByCode = {};
      snapshot.forEach((docSnap) => {
        const name = docSnap.id;
        const code = docSnap.data().code;
        globalCustomersByName[name] = code;
        globalCustomersByCode[code] = name;
      });
    });

    // 帶入邏輯
    window.onNameInput = function() {
      const name = document.getElementById('input-name').value.trim();
      const codeInput = document.getElementById('input-code');

      if (globalCustomersByName[name]) {
        codeInput.value = globalCustomersByName[name];
      } else if (name) {
        if (!codeInput.value || codeInput.getAttribute('data-auto') === 'true') {
          codeInput.value = generateCustomerCode();
          codeInput.setAttribute('data-auto', 'true');
        }
      } else {
        codeInput.value = '';
        codeInput.removeAttribute('data-auto');
      }
    };

    window.onCodeInput = function() {
      const codeInput = document.getElementById('input-code');
      const code = codeInput.value.trim();
      const nameInput = document.getElementById('input-name');

      codeInput.removeAttribute('data-auto');

      if (globalCustomersByCode[code]) {
        nameInput.value = globalCustomersByCode[code];
      }
    };

    // 新增訂單（支援多商品批次寫入）
    window.handleSaveOrder = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;

      const name = document.getElementById('input-name').value.trim();
      const code = document.getElementById('input-code').value.trim();
      const poNumber = document.getElementById('input-po').value.trim();
      const date = document.getElementById('input-date').value || getTodayString();
      const status = document.getElementById('input-status').value;
      const rate = parseFloat(document.getElementById('global-rate').value) || 0.22;

      // 抓取多商品資料
      const itemRows = document.querySelectorAll('.item-row');
      const itemsData = [];
      itemRows.forEach(row => {
        const item = row.querySelector('.item-name').value.trim();
        const jpy = parseFloat(row.querySelector('.item-jpy').value) || 0;
        const twd = parseFloat(row.querySelector('.item-twd').value) || 0;
        if (item) {
          itemsData.push({ item, jpy, twd });
        }
      });

      if (itemsData.length === 0) {
        alert('請填寫至少一項商品！');
        btn.disabled = false;
        return;
      }

      try {
        const batch = writeBatch(db);

        // 1. 更新客戶名冊
        const customerRef = doc(db, "buy_agent_customers", name);
        batch.set(customerRef, { code: code });

        // 2. 批次新增每筆商品訂單
        itemsData.forEach(data => {
          const newOrderRef = doc(collection(db, "buy_agent_orders"));
          batch.set(newOrderRef, {
            date: date,
            customerCode: code,
            name: name,
            poNumber: poNumber,
            item: data.item,
            jpy: data.jpy,
            twd: data.twd,
            rate: rate,
            status: status
          });
        });

        await batch.commit();

        alert(`成功新增 ${itemsData.length} 筆訂單資料！`);
        document.getElementById('order-form').reset();
        document.getElementById('input-date').value = getTodayString();
        document.getElementById('input-code').removeAttribute('data-auto');
        
        // 重置商品表單為一列
        document.getElementById('items-container').innerHTML = '';
        addItemRow();

      } catch (error) {
        alert("寫入失敗：" + error.message);
      } finally {
        btn.disabled = false;
      }
    };

    // ✏️ 修改 Modal 邏輯
    window.openEditModal = function(docId) {
      const order = globalOrders.find(o => o.docId === docId);
      if (!order) return;

      document.getElementById('edit-doc-id').value = order.docId;
      document.getElementById('edit-date').value = order.date || '';
      document.getElementById('edit-code').value = order.customerCode || '';
      document.getElementById('edit-name').value = order.name || '';
      document.getElementById('edit-po').value = order.poNumber || '';
      document.getElementById('edit-item').value = order.item || '';
      document.getElementById('edit-jpy').value = order.jpy || 0;
      document.getElementById('edit-twd').value = order.twd || 0;
      document.getElementById('edit-status').value = order.status || '🟡 採購中';

      const modal = document.getElementById('edit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.closeEditModal = function() {
      const modal = document.getElementById('edit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    window.handleUpdateOrder = async function(e) {
      e.preventDefault();
      const docId = document.getElementById('edit-doc-id').value;
      if (!docId) return;

      try {
        const orderRef = doc(db, "buy_agent_orders", docId);
        await updateDoc(orderRef, {
          date: document.getElementById('edit-date').value,
          customerCode: document.getElementById('edit-code').value.trim(),
          name: document.getElementById('edit-name').value.trim(),
          poNumber: document.getElementById('edit-po').value.trim(),
          item: document.getElementById('edit-item').value.trim(),
          jpy: parseFloat(document.getElementById('edit-jpy').value) || 0,
          twd: parseFloat(document.getElementById('edit-twd').value) || 0,
          status: document.getElementById('edit-status').value
        });

        alert('訂單修改成功！');
        closeEditModal();
      } catch (err) {
        alert('修改失敗：' + err.message);
      }
    };

    // 單筆更新貨態
    window.updateOrderStatus = async function(docId, newStatus) {
      if (confirm(`確定要將此訂單貨態更改為「${newStatus}」嗎？`)) {
        try {
          await updateDoc(doc(db, "buy_agent_orders", docId), { status: newStatus });
        } catch (err) {
          alert("貨態更新失敗：" + err.message);
        }
      } else {
        renderAdminTable();
      }
    };

    // 全選/全不選
    window.toggleSelectAll = function(master) {
      const checkboxes = document.querySelectorAll('.order-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateSelectedCount();
    };

    // 更新勾選數量統計
    window.updateSelectedCount = function() {
      const selected = document.querySelectorAll('.order-checkbox:checked');
      document.getElementById('selected-count').innerText = selected.length;
    };

    // ⚡ 批量寫入/更新貨態
    window.executeBatchUpdate = async function() {
      const selectedBoxes = document.querySelectorAll('.order-checkbox:checked');
      if (selectedBoxes.length === 0) {
        alert('請先勾選要修改貨態的訂單！');
        return;
      }

      const newStatus = document.getElementById('batch-target-status').value;
      if (!confirm(`確定要將勾選的 ${selectedBoxes.length} 筆訂單貨態一次改為「${newStatus}」嗎？`)) {
        return;
      }

      try {
        const batch = writeBatch(db);
        selectedBoxes.forEach(box => {
          const docId = box.value;
          const orderRef = doc(db, "buy_agent_orders", docId);
          batch.update(orderRef, { status: newStatus });
        });

        await batch.commit();
        alert(`成功批量更新 ${selectedBoxes.length} 筆訂單貨態為「${newStatus}」！`);
        document.getElementById('select-all').checked = false;
      } catch (err) {
        console.error("批量更新失敗：", err);
        alert("批量更新失敗：" + err.message);
      }
    };

    // 重置清單過濾器
    window.clearFilters = function() {
      document.getElementById('filter-keyword').value = '';
      document.getElementById('filter-status').value = '';
      renderAdminTable();
    };

    // 渲染資料表 (新增修改按鈕)
    window.renderAdminTable = function() {
      const activeOrders = globalOrders.filter(o => o.status !== '✅ 已結單');
      const completedOrders = globalOrders.filter(o => o.status === '✅ 已結單');

      document.getElementById('count-active').innerText = activeOrders.length;
      document.getElementById('count-completed').innerText = completedOrders.length;

      let targetOrders = currentTab === 'active' ? activeOrders : completedOrders;

      // 關鍵字搜尋
      const keyword = document.getElementById('filter-keyword').value.trim().toLowerCase();
      if (keyword) {
        targetOrders = targetOrders.filter(o => 
          (o.name && o.name.toLowerCase().includes(keyword)) ||
          (o.customerCode && o.customerCode.toLowerCase().includes(keyword)) ||
          (o.poNumber && o.poNumber.toLowerCase().includes(keyword)) ||
          (o.item && o.item.toLowerCase().includes(keyword))
        );
      }

      // 貨態過濾
      const statusFilter = document.getElementById('filter-status').value;
      if (statusFilter) {
        targetOrders = targetOrders.filter(o => o.status === statusFilter);
      }

      currentDisplayedOrders = targetOrders;

      const tbody = document.getElementById('admin-order-list');
      if (targetOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="p-4 text-center text-slate-400">尚無符合條件的訂單資料</td></tr>`;
        document.getElementById('select-all').checked = false;
        updateSelectedCount();
        return;
      }

      const statusOptions = [
        "🟡 採購中", "🔵 日本倉庫已收貨", "🟣 國際運送中", 
        "🟠 抵達台灣倉庫", "🟢 已寄出", "✅ 已結單"
      ];

      tbody.innerHTML = targetOrders.map(o => {
        const costTwd = Math.round((o.jpy || 0) * (o.rate || 0.22));
        const profit = (o.twd || 0) - costTwd;
        const optionsHtml = statusOptions.map(st => `<option value="${st}" ${o.status === st ? 'selected' : ''}>${st}</option>`).join('');

        return `
          <tr>
            <td class="p-3">
              <input type="checkbox" value="${o.docId}" onchange="updateSelectedCount()" class="order-checkbox rounded text-amber-500 focus:ring-amber-500">
            </td>
            <td class="p-3 text-xs font-mono text-slate-500">${o.date || '--'}</td>
            <td class="p-3 font-mono font-bold text-amber-700">${o.customerCode || '--'}</td>
            <td class="p-3 font-medium">${o.name || '--'}</td>
            <td class="p-3 font-mono text-xs text-slate-600">${o.poNumber || '<span class="text-slate-300">-</span>'}</td>
            <td class="p-3">${o.item || '--'}</td>
            <td class="p-3 font-mono">¥ ${(o.jpy || 0).toLocaleString()}</td>
            <td class="p-3 font-mono">NT$ ${(o.twd || 0).toLocaleString()}</td>
            <td class="p-3 font-mono ${profit >= 0 ? 'text-emerald-600' : 'text-rose-600'}">NT$ ${profit.toLocaleString()}</td>
            <td class="p-3">
              <select onchange="updateOrderStatus('${o.docId}', this.value)" class="px-2 py-1 bg-slate-50 border rounded text-xs focus:ring-2 focus:ring-amber-500 outline-none">
                ${optionsHtml}
              </select>
            </td>
            <td class="p-3 space-x-2">
              <button onclick="openEditModal('${o.docId}')" class="text-xs text-amber-600 hover:underline font-medium">修改</button>
              <button onclick="deleteOrder('${o.docId}')" class="text-xs text-rose-500 hover:underline">刪除</button>
            </td>
          </tr>
        `;
      }).join('');

      document.getElementById('select-all').checked = false;
      updateSelectedCount();
    };

    // 切換分頁
    window.switchView = function(tab) {
      currentTab = tab;
      const tabActive = document.getElementById('tab-active');
      const tabCompleted = document.getElementById('tab-completed');

      if (tab === 'active') {
        tabActive.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-amber-500 text-white shadow-sm transition';
        tabCompleted.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      } else {
        tabCompleted.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-emerald-600 text-white shadow-sm transition';
        tabActive.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition';
      }
      renderAdminTable();
    };

    // 刪除訂單
    window.deleteOrder = async function(docId) {
      if (confirm('確定要刪除這筆訂單資料嗎？')) {
        await deleteDoc(doc(db, "buy_agent_orders", docId));
      }
    };

    // 依時間區間導出 Excel
    window.exportMonthlyReport = async function() {
      const startDate = document.getElementById('export-start-date').value;
      const endDate = document.getElementById('export-end-date').value;

      if (!startDate || !endDate) {
        alert("請選擇完整的開始與結束日期！");
        return;
      }

      const filteredOrders = globalOrders.filter(o => {
        const orderDate = o.date || '1970-01-01';
        return orderDate >= startDate && orderDate <= endDate;
      });

      if (filteredOrders.length === 0) {
        alert(`在 ${startDate} 至 ${endDate} 區間內查無任何訂單資料可供匯出。`);
        return;
      }

      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('營業額報表');

      sheet.columns = [
        { header: '成交日期', key: 'date', width: 12 },
        { header: '客戶編號', key: 'customerCode', width: 15 },
        { header: '客戶姓名', key: 'name', width: 12 },
        { header: '商家/官網單號', key: 'poNumber', width: 22 },
        { header: '委託商品', key: 'item', width: 25 },
        { header: '日幣成本 (JPY)', key: 'jpy', width: 15 },
        { header: '當下匯率', key: 'rate', width: 10 },
        { header: '客人台幣金額 (TWD)', key: 'twd', width: 20 },
        { header: '預估毛利 (TWD)', key: 'profit', width: 15 },
        { header: '當前貨態', key: 'status', width: 15 }
      ];

      filteredOrders.forEach(o => {
        const costTwd = Math.round((o.jpy || 0) * (o.rate || 0.22));
        sheet.addRow({
          ...o,
          poNumber: o.poNumber || '',
          profit: (o.twd || 0) - costTwd
        });
      });

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `代購營業額報表_${startDate}_至_${endDate}.xlsx`;
      a.click();
    };
  </script>
</body>
</html>
